<!doctype html>
<html lang="te"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f4a5a"><title>గాయత్రి వన్ — నెట్ లేదు</title><style>:root{--background:#ffffff;--foreground:#123c45;--muted:#53656a;--gold:#e4bd40}*{box-sizing:border-box}body{margin:0;background:var(--background);color:var(--foreground);font-family:system-ui,sans-serif}main{max-width:440px;margin:auto;padding:32px 24px;text-align:center}img{width:96px;height:96px}h1{font-size:28px}p{line-height:1.8}a{display:block;margin:16px 0;padding:16px;background:var(--gold);color:var(--foreground);border-radius:8px;text-decoration:none;font-weight:bold}footer{padding:24px;color:var(--muted)}</style></head><body><main><img src="/icon-192.png" alt="గాయత్రి వన్"><h1>గాయత్రి వన్</h1><p>మన ప్రాంత సమాచారం మన గుప్పెట్లో</p><h2>ప్రస్తుతం నెట్ లేదు</h2><p>ఉద్యోగాలు, వాహనాల తాజా వివరాలు చూడటానికి, ప్రకటన పెట్టడానికి, సందేశాలు పంపడానికి నెట్ కావాలి.</p><a href="/">ముఖపేజీ చూడండి</a><p>నెట్ వచ్చిన తరువాత మళ్లీ తెరవండి.</p><footer>డిజైన్: గాయత్రి వన్</footer></main></body></html>
